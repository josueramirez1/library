<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="books"></div>
      <button class="add-btn">Add Book</button>
    </div>
    <form class="form">
      <p>
        <label for="title">Title</label>
        <input type="text" id="title" name="title" />
      </p>
      <p>
        <label for="author">Author</label>
        <input type="text" id="author" name="author" />
      </p>
      <p>
        <label for="pages">Pages</label>
        <input type="text" id="pages" name="pages" />
      </p>
      <p>
        <span>Completed?</span>
        <input type="radio" id="completed-yes" value="yes" name="completed" />
        <label for="completed-yes">Yes</label>
        <input type="radio" id="completed-no" value="no" name="completed" />
        <label for="completed-no">No</label>
      </p>
      <button class="to-list-btn" type="submit">Add To List</button>
    </form>
  </body>
</html>
