<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="books"></div>
      <button popovertarget="my-dialog" class="add-btn">Add Book</button>
      <dialog id="my-dialog" popover>
        <form>
          <p>
            <label for="title">Title</label>
            <input
              type="text"
              id="title"
              name="title"
              required
              placeholder="Ex: A Brave New World"
            />
          </p>
          <p>
            <label for="author">Author</label>
            <input
              type="text"
              id="author"
              name="author"
              required
              placeholder="Ex: Oliver Smith"
            />
          </p>
          <p>
            <label for="pages">Pages</label>
            <input
              type="text"
              id="pages"
              name="pages"
              required
              placeholder="Ex: 1234"
            />
          </p>
          <p>
            <span>Completed?</span>
            <input
              type="radio"
              id="completed-yes"
              value="yes"
              name="completed"
            />
            <label for="completed-yes">Yes</label>
            <input type="radio" id="completed-no" value="no" name="completed" />
            <label for="completed-no">No</label>
          </p>
          <div>
            <button class="to-list-btn add" type="submit">Add To List</button>
            <button
              class="to-list-btn close"
              type="button"
              popovertarget="my-dialog"
              popovertargetaction="hide"
            >
              Close
            </button>
            <button class="to-list-btn" type="reset">Reset</button>
          </div>
        </form>
      </dialog>
    </div>
  </body>
</html>
